openapi: 3.0.3
info:
  title: Unicoach REST API
  description: REST API for the Unicoach product surface (auth, students, conversations).
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The opaque session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Login a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User successfully authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The opaque session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed request body (e.g. wrong JSON value types)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/google:
    post:
      summary: Sign in with a Google ID token
      description: >
        Verifies a Google ID token and establishes a session. Both first-time
        signup and returning login return 200 with the session cookie; the
        response does not distinguish them, so account existence is not disclosed.
      operationId: loginWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: User successfully authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The opaque session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed request body (e.g. wrong JSON value types)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Malformed, expired, or otherwise invalid Google ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Google account email not verified, the matched account is
            disabled, or the matched local account's own email is unverified
            (account_email_not_verified — linking is refused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Google sign-in is temporarily unavailable (JWKS endpoint unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/apple:
    post:
      summary: Sign in with an Apple ID token
      description: >
        Verifies an Apple identity token and establishes a session. Both
        first-time signup and returning login return 200 with the session
        cookie; the response does not distinguish them, so account existence
        is not disclosed. The optional `name` is used only when provisioning a
        new user — Apple's identity token never carries a name claim, so the
        client supplies it out of band, once, at first authorization.
      operationId: loginWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleLoginRequest'
      responses:
        '200':
          description: User successfully authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The opaque session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed request body (e.g. wrong JSON value types)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Malformed, expired, or otherwise invalid Apple ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Apple account email not verified, the matched account is
            disabled, or the matched local account's own email is unverified
            (account_email_not_verified — linking is refused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Apple sign-in is temporarily unavailable (JWKS endpoint unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: Logout current user
      operationId: logoutUser
      responses:
        '204':
          description: Session successfully revoked and cookie cleared
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The cleared session cookie
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/verify-email:
    post:
      summary: Verify an email address with a single-use token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: >
            Token invalid, expired, or already used. The error code is one of
            invalid_token, token_expired, or token_already_used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/resend-verification:
    post:
      summary: Resend the verification email for the authenticated user
      operationId: resendVerification
      security:
        - cookieAuth: []
      responses:
        '204':
          description: >
            Verification email resent, or the user is already verified
            (idempotent — no email is sent in the already-verified case).
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students:
    post:
      summary: Create the current user's student profile
      description: >
        Creates the owner-resolved student profile for the authenticated user.
        The resource is a per-user singleton; there is no path identifier.
      operationId: createStudent
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Student profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A student profile already exists for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students/me:
    get:
      summary: Get the current user's student profile
      operationId: getStudentMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The authenticated user's student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The user has no student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the current user's student profile
      operationId: updateStudentMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          description: Student profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The user has no student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Optimistic concurrency version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete the current user's student profile and account
      description: >
        Soft-deletes the student row and the owning user row atomically and
        clears the session cookie. All sessions are invalidated.
      operationId: deleteStudentMe
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Student profile and account deleted; session cookie cleared
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The cleared session cookie
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The user has no student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students/me/college-list:
    post:
      summary: Add a college to the current student's college list
      operationId: createCollegeListEntry
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollegeListEntryRequest'
      responses:
        '201':
          description: College added to the list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeListEntryResponse'
        '400':
          description: Validation failure (unknown status value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such college, or no such observation cited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: College already on the list, or no student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List every active entry on the current student's college list
      operationId: listCollegeListEntries
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The caller's active college list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students/me/college-list/{entryId}:
    get:
      summary: Get one college list entry owned by the current student
      operationId: getCollegeListEntry
      security:
        - cookieAuth: []
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested college list entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeListEntryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such college list entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Replace the status and reasons on a college list entry
      operationId: updateCollegeListEntry
      security:
        - cookieAuth: []
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollegeListEntryRequest'
      responses:
        '200':
          description: College list entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeListEntryResponse'
        '400':
          description: Validation failure (unknown status value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such college list entry, or no such observation cited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Optimistic concurrency version conflict, or no student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a college from the current student's college list
      description: >
        Soft-deletes the entry. Removing and re-adding the same college later
        creates a new entry; the prior removal's history stays intact under its
        own soft-deleted id.
      operationId: deleteCollegeListEntry
      security:
        - cookieAuth: []
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int32
          description: Optimistic-concurrency version the client last observed.
      responses:
        '204':
          description: College list entry removed
        '400':
          description: Missing or non-integer version query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such college list entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Optimistic concurrency version conflict, or no student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/v1/colleges:
    get:
      summary: Search the college catalog by name
      description: >
        Case-insensitive substring match on the college name, prefix matches
        first, then larger institutions. Requires an authenticated session but
        no student profile — the catalog is not the caller's college list.
      operationId: searchColleges
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: The name fragment to search for. Trimmed; must be non-blank.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum results; clamped server-side to 1..25.
      responses:
        '200':
          description: Matching colleges, best match first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeSearchResponse'
        '400':
          description: Validation failure (q missing/blank/too long, limit non-integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students/me/money-profile:
    get:
      summary: Get the current student's money profile
      operationId: getMoneyProfile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The caller's money profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyProfileResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No money profile yet (nothing has been written)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Create or update the current student's money profile
      description: >
        Idempotent create-or-update of any subset of fields. Per field, at most
        one of value / declined / clear may be supplied; an omitted field is
        untouched. Declining or clearing a field removes its value (the schema
        holds a value exactly when a field is answered).
      operationId: putMoneyProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMoneyProfileRequest'
      responses:
        '200':
          description: The full post-write money profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyProfileResponse'
        '400':
          description: Validation failure (unknown income band, malformed state code, or value+declined for one field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Owning student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request body could not be deserialized into the expected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/students/me/coaching-usage:
    get:
      summary: Read the caller's coaching usage
      description: >
        The abstract coaching meter for the caller's student: how much of the
        free allowance is used, and whether coaching is currently blocked. It
        reports no dollars, token counts, or provider names by design.
      operationId: getCoachingUsage
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The caller's coaching usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachingUsageResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The caller has no student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subscriptions/verify:
    post:
      summary: Verify an Apple subscription purchase
      description: >
        The app posts the StoreKit 2 signed transaction (JWS); the backend uses
        it only as a lookup key, fetches the authoritative subscription state
        from the App Store Server API, and records it as the caller's
        subscription. This is the only path that BINDS a subscription to an
        account; re-posting is the idempotent refresh path. Renewals reach the
        server through the App Store Server Notifications V2 webhook, not
        through here. Non-entitling statuses (expired, revoked, ...) still
        record and answer 200 — the row reflects Apple truth; entitlement is the
        budget gate's concern.
      operationId: verifySubscription
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionVerifyRequest'
      responses:
        '200':
          description: The subscription was verified and recorded (or refreshed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionVerifyResponse'
        '400':
          description: >
            Blank, oversized, or undecodable signedTransaction, or one carrying
            no usable transactionId claim (code validation_failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email not verified (code email_not_verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The App Store knows no such transaction in this environment (code
            subscription_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            The caller has no student profile (code student_profile_required),
            or the subscription is bound to another account (code
            subscription_owned_by_other_account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            Subscription verification is temporarily unavailable (App Store
            unreachable or credentials not configured; code service_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subscriptions/apple-notifications:
    post:
      summary: Receive an App Store Server Notification V2
      description: >
        Apple posts subscription lifecycle notifications here. The endpoint
        carries no session: the notification's own JWS signature is its entire
        authentication — the x5c certificate chain is validated by PKIX to a
        pinned Apple root, the leaf must carry Apple's notification marker OID,
        and ES256 is pinned by the verifying algorithm. The notification is a
        trigger, not a state carrier: an accepted delivery enqueues one refresh
        job that re-reads authoritative state from the App Store Server API, so
        duplicate and out-of-order deliveries are no-ops. A notification for a
        subscription no account has verified refreshes nothing and creates
        nothing.
      operationId: receiveAppleNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleNotificationRequest'
      responses:
        '200':
          description: >
            The notification was accepted. The body is empty — Apple reads only
            the status code. A notification naming no transaction (TEST, or a
            renewal-extension summary) is also 200 and enqueues nothing.
        '400':
          description: >
            The notification is Apple-signed but targets another bundle or
            another App Store environment (code validation_failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            The signedPayload is not a valid Apple-signed notification — an
            oversized, malformed, or unverifiable JWS, on the outer payload or
            on the nested transaction (code unauthorized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >
            The refresh could not be enqueued, or the notification is
            Apple-signed in a payload shape this server has never seen. Apple
            retries (code internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations:
    post:
      summary: Start a conversation with its first message
      description: >
        Creates a conversation owned by the caller's student and records the first
        user turn, returning the conversation plus the buffered coach reply.
        The name is derived from the first message when not supplied.
      operationId: createConversation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation started; first turn recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
        '400':
          description: Validation failure (empty/oversized message, invalid name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The student's coaching allowance is exhausted (code coaching_budget_exhausted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The caller has no student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List the caller's conversations
      operationId: listConversations
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [active, archived]
            default: active
          description: active returns non-archived conversations; archived returns archived ones. Deleted conversations are never returned.
      responses:
        '200':
          description: The caller's conversations, most recent activity first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations/stream:
    post:
      summary: Start a conversation and stream the first reply
      description: >
        As createConversation, but streams the coach's first reply as
        Server-Sent Events. The stream opens with a conversation event carrying the
        new conversation id and the persisted user message, then emits delta events,
        and terminates with a single message or error event.
      operationId: streamConversation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: SSE stream of the first turn
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          description: Validation failure (rejected before the stream opens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The student's coaching allowance is exhausted (code coaching_budget_exhausted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The caller has no student profile (code student_profile_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations/{conversationId}:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Fetch a conversation
      operationId: getConversation
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such conversation owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Rename and/or archive a conversation
      operationId: updateConversation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: Validation failure (empty body, invalid name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such conversation owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete (soft-delete) a conversation
      description: >
        Soft-deletes the conversation: it leaves all listings and can no longer be
        fetched. The underlying transcript is preserved as the memory source of
        truth. Distinct from archive, which is reversible.
      operationId: deleteConversation
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Conversation deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such conversation owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Fetch the message history
      description: Returns all messages in the conversation in chronological order (oldest first).
      operationId: listMessages
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The conversation's messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such conversation owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Post a user message and receive the coach reply
      operationId: postMessage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '201':
          description: The turn was recorded; the user and coach messages are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMessageResponse'
        '400':
          description: Validation failure (empty/oversized message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The student's coaching allowance is exhausted (code coaching_budget_exhausted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such conversation owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/conversations/{conversationId}/messages/stream:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Post a user message and stream the coach reply
      description: >
        As postMessage, but streams the reply as Server-Sent Events. The stream
        opens with a user_message event echoing the persisted user message, then
        emits delta events, and terminates with a single message or error event.
      operationId: streamMessage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '200':
          description: SSE stream of the turn
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          description: Validation failure (rejected before the stream opens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The student's coaching allowance is exhausted (code coaching_budget_exhausted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such conversation owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: UNICOACH_SESSION
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >
            Must be 8-128 characters and contain at least one uppercase letter,
            one lowercase letter, and one digit (enforced by the server's
            RegistrationValidator). The pattern encodes that policy so the
            contract is honest and fuzzers generate acceptable values.
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,128}$'
        name:
          type: string
          minLength: 1
          description: Must not be blank (server rejects a blank name).
    PublicUser:
      type: object
      required: [id, email, name, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        emailVerified:
          type: boolean
          description: Whether the user's email address has been verified.
    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: A Google-issued ID token (JWT)
    AppleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: An Apple-issued identity token (JWT)
        name:
          type: string
          nullable: true
          description: >
            Optional client-supplied display name, used only when provisioning
            a new user. Apple's identity token never carries a name claim.
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: The single-use raw verification token from the email link.
    VerifyEmailResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
    CreateStudentRequest:
      type: object
      additionalProperties: false
      required: [expectedHighSchoolGraduationDate]
      properties:
        expectedHighSchoolGraduationDate:
          type: string
          description: >
            Variable-precision expected high-school graduation date in
            zero-padded canonical ISO form: YYYY, YYYY-MM, or YYYY-MM-DD.
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
          example: "2028-06-15"
    UpdateStudentRequest:
      type: object
      additionalProperties: false
      required: [expectedHighSchoolGraduationDate, version]
      properties:
        expectedHighSchoolGraduationDate:
          type: string
          description: >
            Variable-precision expected high-school graduation date in
            zero-padded canonical ISO form: YYYY, YYYY-MM, or YYYY-MM-DD.
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
          example: "2028-06"
        version:
          type: integer
          format: int32
          description: Optimistic-concurrency version the client last observed.
    PublicStudent:
      type: object
      required: [id, expectedHighSchoolGraduationDate, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        expectedHighSchoolGraduationDate:
          type: string
          description: Zero-padded ISO at the stored precision (YYYY | YYYY-MM | YYYY-MM-DD).
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StudentResponse:
      type: object
      required: [student]
      properties:
        student:
          $ref: '#/components/schemas/PublicStudent'
    UpdateMoneyProfileRequest:
      type: object
      additionalProperties: false
      properties:
        incomeBand:
          type: string
          enum: [under_30k, 30k_to_48k, 48k_to_75k, 75k_to_110k, over_110k]
          nullable: true
        incomeBandDeclined:
          type: boolean
          default: false
        incomeBandClear:
          type: boolean
          default: false
        residencyState:
          type: string
          nullable: true
          description: Two-letter USPS state code (case-insensitive on input).
        residencyDeclined:
          type: boolean
          default: false
        residencyClear:
          type: boolean
          default: false
    PublicMoneyProfile:
      type: object
      required: [incomeBandStatus, residencyStatus, version, createdAt, updatedAt]
      properties:
        incomeBandStatus:
          type: string
          enum: [unanswered, answered, declined]
        incomeBand:
          type: string
          enum: [under_30k, 30k_to_48k, 48k_to_75k, 75k_to_110k, over_110k]
          nullable: true
        residencyStatus:
          type: string
          enum: [unanswered, answered, declined]
        residencyState:
          type: string
          nullable: true
          pattern: '^[A-Z]{2}$'
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MoneyProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/PublicMoneyProfile'
    CreateCollegeListEntryRequest:
      type: object
      additionalProperties: false
      required: [collegeId]
      properties:
        collegeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [considering, applying, admitted, rejected]
          default: considering
        reasons:
          type: string
          nullable: true
          maxLength: 2048
        observationIds:
          type: array
          items:
            type: integer
            format: int64
          default: []
    UpdateCollegeListEntryRequest:
      type: object
      additionalProperties: false
      required: [version, status, reasons]
      properties:
        version:
          type: integer
          format: int32
          description: Optimistic-concurrency version the client last observed.
        status:
          type: string
          enum: [considering, applying, admitted, rejected]
        reasons:
          type: string
          nullable: true
          maxLength: 2048
        addObservationIds:
          type: array
          items:
            type: integer
            format: int64
          default: []
    ObservationSummary:
      type: object
      required: [id, quote, utteredAt]
      properties:
        id:
          type: integer
          format: int64
        quote:
          type: string
        utteredAt:
          type: string
          format: date-time
    PublicCollegeListEntry:
      type: object
      required: [id, collegeId, collegeName, status, reasons, version, createdAt, updatedAt, supportingObservations]
      properties:
        id:
          type: string
          format: uuid
        collegeId:
          type: string
          format: uuid
        collegeName:
          type: string
        status:
          type: string
          enum: [considering, applying, admitted, rejected]
        reasons:
          type: string
          nullable: true
          maxLength: 2048
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        supportingObservations:
          type: array
          items:
            $ref: '#/components/schemas/ObservationSummary'
    CollegeListEntryResponse:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: '#/components/schemas/PublicCollegeListEntry'
    CollegeListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PublicCollegeListEntry'
    PublicCollegeSummary:
      type: object
      required: [id, name, city, state]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        state:
          type: string
    CollegeSearchResponse:
      type: object
      required: [colleges]
      properties:
        colleges:
          type: array
          items:
            $ref: '#/components/schemas/PublicCollegeSummary'
    CoachingUsageResponse:
      type: object
      required: [usage]
      properties:
        usage:
          $ref: '#/components/schemas/CoachingUsage'
    CoachingUsage:
      type: object
      required: [usedPercent, exhausted, resetsAt]
      properties:
        usedPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of the current allowance already used, floored and capped.
        exhausted:
          type: boolean
          description: >
            Whether coaching is currently blocked. Equivalent to usedPercent == 100,
            carried explicitly so a client never re-derives the block condition.
        resetsAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the meter resets — the subscription period's end. Null on the
            free tier, whose lifetime allowance never resets.
    SubscriptionVerifyRequest:
      type: object
      additionalProperties: false
      required: [signedTransaction]
      properties:
        signedTransaction:
          type: string
          minLength: 1
          maxLength: 16384
          description: The StoreKit 2 signed transaction (JWS) as received from Product.purchase().
    AppleNotificationRequest:
      type: object
      additionalProperties: false
      required: [signedPayload]
      properties:
        signedPayload:
          type: string
          minLength: 1
          maxLength: 32768
          description: >
            One App Store Server Notification V2, as Apple posts it: a JWS whose
            x5c chain and ES256 signature are the request's entire
            authentication.
    SubscriptionVerifyResponse:
      type: object
      required: [subscription]
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionView'
    SubscriptionView:
      type: object
      required: [status, productId, currentPeriodEnd]
      properties:
        status:
          type: string
          enum: [active, expired, billing_retry, grace, revoked]
          description: The recorded subscription status (Apple's status, snake_cased).
        productId:
          type: string
          maxLength: 255
        currentPeriodEnd:
          type: string
          format: date-time
          description: The current entitlement window's end — also the usage meter's reset date.
    Conversation:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Advances on rename only; not on new messages.
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Derived MAX(convo_requests.created_at). Null for a conversation with no
            turns yet. Use this — not updatedAt — to sort the chat list by recency.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Non-null when the conversation is archived; null when active.
    Message:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: string
          description: >
            Opaque, stable message id. Clients must not parse it or assume ordering.
        role:
          type: string
          enum: [user, coach]
        content:
          type: string
          description: Rendered message text projected from the stored content blocks.
        createdAt:
          type: string
          format: date-time
    CreateConversationRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 100000
          description: The first user message; the conversation name is derived from it when name is omitted.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional caller-supplied name; server derives one from the first message when absent.
    PostMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 100000
          description: The user message text. Named to match CreateConversationRequest.message; both carry the same concept.
    UpdateConversationRequest:
      type: object
      minProperties: 1
      description: At least one field must be present. Conversations are unversioned; no version field.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        archived:
          type: boolean
          description: true archives (sets archivedAt); false unarchives (clears archivedAt).
    ConversationResponse:
      type: object
      required: [conversation]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
    ConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
    CreateConversationResponse:
      type: object
      required: [conversation, userMessage, coachMessage]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        userMessage:
          $ref: '#/components/schemas/Message'
        coachMessage:
          $ref: '#/components/schemas/Message'
    PostMessageResponse:
      type: object
      required: [userMessage, coachMessage]
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        coachMessage:
          $ref: '#/components/schemas/Message'
    MessageListResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    ConversationCreatedEvent:
      type: object
      required: [type, conversation, userMessage]
      properties:
        type:
          type: string
          enum: [conversation]
        conversation:
          $ref: '#/components/schemas/Conversation'
        userMessage:
          $ref: '#/components/schemas/Message'
    UserMessageEvent:
      type: object
      required: [type, userMessage]
      properties:
        type:
          type: string
          enum: [user_message]
        userMessage:
          $ref: '#/components/schemas/Message'
    MessageDeltaEvent:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [delta]
        text:
          type: string
          description: A token/text fragment of the coach reply, appended in order.
    MessageCompletedEvent:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [message]
        message:
          $ref: '#/components/schemas/Message'
          description: The persisted coach message (see Streaming protocol for the delta-concatenation guarantee).
    StreamErrorEvent:
      type: object
      required: [type, error]
      properties:
        type:
          type: string
          enum: [error]
        error:
          $ref: '#/components/schemas/ErrorResponse'
    StreamEvent:
      oneOf:
        - $ref: '#/components/schemas/ConversationCreatedEvent'
        - $ref: '#/components/schemas/UserMessageEvent'
        - $ref: '#/components/schemas/MessageDeltaEvent'
        - $ref: '#/components/schemas/MessageCompletedEvent'
        - $ref: '#/components/schemas/StreamErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          conversation: '#/components/schemas/ConversationCreatedEvent'
          user_message: '#/components/schemas/UserMessageEvent'
          delta: '#/components/schemas/MessageDeltaEvent'
          message: '#/components/schemas/MessageCompletedEvent'
          error: '#/components/schemas/StreamErrorEvent'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          nullable: true
          description: >
            Per-field validation detail. The server emits this key explicitly as
            null when an error carries no field-level detail (e.g. 401, 409), so
            it is nullable as well as optional.
          items:
            $ref: '#/components/schemas/FieldError'

