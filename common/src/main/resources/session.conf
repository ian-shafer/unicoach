# The session cookie's IDENTITY, shared by every server that issues or reads the
# ONE `UNICOACH_SESSION` cookie (RFC 224 D-B). It lives in `:common` rather than
# in `rest-server.conf` so that `rest-server` and `public-web` cannot drift into
# two different cookies while claiming to share one session.
#
# The cookie's LIFETIME is deliberately NOT shared: it is per-client, and each
# server states its own. `rest-server` keeps the `expiration` below; `public-web`
# reads `publicWeb.session.expiration` instead (RFC 224 D-D).
session {
    # The cookie NAME is part of the shared contract (RFC 224 D-B), not a
    # per-environment setting: each JVM reads its OWN environment, so an override
    # exported for one server and not the other splits the shared session
    # silently — exactly the drift this file exists to prevent. It is the same
    # class of value as Path=/, HttpOnly and SameSite=Strict, which the one
    # cookie writer keeps private for the same reason. Changing it is a code
    # change, in this one place.
    cookieName = "UNICOACH_SESSION"
    # No HOCON default: APP_DOMAIN is a JVM+Shell+iOS+Terraform value, so it lives
    # once in the dotenv layer (.env) and HOCON pulls it with a required ${VAR}.
    cookieDomain = ${APP_DOMAIN}
    # Required substitution (no default): a forgotten cloud override fails the JVM
    # at boot rather than silently serving an insecure cookie. Set in every env's
    # dotenv (.env.dev=false, .env.<env>=true).
    cookieSecure = ${SESSION_COOKIE_SECURE}
    # rest-server ONLY. public-web reads publicWeb.session.expiration (RFC 224
    # D-D) and never looks at this key, so the override is named for the client
    # it actually moves: a shared-looking SESSION_EXPIRATION would promise a
    # reach it does not have, and an operator lengthening "the session" by
    # environment would get half a change.
    expiration = "7d"
    expiration = ${?REST_SERVER_SESSION_EXPIRATION}
}
