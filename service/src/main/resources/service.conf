coaching {
  model = "claude-sonnet-4-6"
  model = ${?COACHING_MODEL}
  maxTokens = 4096
  maxTokens = ${?COACHING_MAX_TOKENS}
  systemPromptName = "coach"
  systemPromptName = ${?COACHING_SYSTEM_PROMPT_NAME}
  # RFC 150: v10 is v9 byte-identical plus one appended paragraph — the coach now
  # searches by SUBJECT rather than by a guessed federal program code, cites the
  # tool's total_matches when saying how many schools match, reports the
  # excluded-unknown counts in words (a school that does not report an axis was
  # not judged on it, and is not a "no"), never states a source code to a
  # student, and applies the money vocabulary to every price the tool returns
  # (db/schema/0065).
  # RFC 151: v11 is v10 byte-identical plus one appended paragraph — when two or
  # more schools appear together the coach now says the comparison_basis lines
  # above the table, renders tuition and fees above the estimated living costs,
  # keeps the table inside three columns, leaves a labelled blank rather than a
  # zero for a part a school does not report, and never mixes two residencies or
  # two ways of living into one column (db/schema/0066).
  # RFC 154: v12 is v11 byte-identical plus one appended paragraph — a school the
  # student names in words (nickname, abbreviation, misspelling) is now looked up
  # with the find_college tool, whose college_id the coach uses verbatim for
  # update_college_list, college_cost_profile and college_admissions_profile and
  # never constructs, guesses or asks for; several matches means the coach asks
  # which one, using city and state; search_colleges stays the tool for the kind
  # of school the student wants rather than one already named; and an
  # unavailable search is said as unavailable, never as "that school does not
  # exist" (db/schema/0068).
  # RFC 153: v13 is v12 byte-identical plus one appended paragraph — the coach now
  # answers "what schools are like X?" with the similar_colleges tool instead of
  # peers remembered from nowhere, gives it an anchor college_id (find_college
  # stays the one name-to-id door), says the axes the answer ranked on and the
  # ones it dropped with their reasons, reads axes_scored aloud, and never
  # presents the distance as a percentage or a quality score (db/schema/0069).
  # Rollback is COACHING_SYSTEM_PROMPT_VERSION=v12 — the v12 row is immutable and
  # stays in the catalog, and leaves the similar-colleges tool registered but
  # un-prompted.
  # RFC 152: v14 is v13 byte-identical plus one appended paragraph — the coach
  # now leads with the one way of living the family said they plan (a global
  # default, overridable per college), names the assumption rather than
  # assuming living at home silently, states plainly why a school is not priced
  # for that plan instead of substituting another arrangement, keeps the other
  # ways of living available for a "what if", and never re-raises a declined
  # plan (db/schema/0072).
  # Rollback is COACHING_SYSTEM_PROMPT_VERSION=v13 — the v13 row is immutable and
  # stays in the catalog.
  # RFC 155: v15 is v14 byte-identical plus one appended paragraph — the coach
  # may now offer the Family Cost Report (a tokenized page a parent opens with
  # no login) once a cost comparison has actually happened, says the report is
  # live and updates as the student updates their list, always says who can see
  # the link and that the student can revoke it, never sends it unasked, and
  # drops the subject when the student declines (db/schema/0074).
  # Rollback is COACHING_SYSTEM_PROMPT_VERSION=v14 — the v14 row is immutable and
  # stays in the catalog.
  systemPromptVersion = "v15"
  systemPromptVersion = ${?COACHING_SYSTEM_PROMPT_VERSION}

  # Gate for the next-session opener injection (RFC 93): compose open explicit
  # commitments into the coach prompt at startConvo and mark them fulfilled on a
  # successful first reply.
  surfaceCommitments = true
  surfaceCommitments = ${?COACHING_SURFACE_COMMITMENTS}

  # Gate for the fit-lens opener contribution (RFC 98): also compose open
  # fit_suggestions into the coach prompt at startConvo and mark them surfaced on
  # a successful first reply, alongside surfaceCommitments.
  surfaceFitSuggestions = true
  surfaceFitSuggestions = ${?COACHING_SURFACE_FIT_SUGGESTIONS}

  # Bound on chat tool-use loop tool-dispatch rounds; on reaching it the loop
  # makes one forced no-tools call to extract a text answer.
  maxToolRounds = 8
  maxToolRounds = ${?COACHING_MAX_TOOL_ROUNDS}
}

# Per-call LLM dollar pricing (RFC 108). Carries NO ${?VAR} substitutions,
# unlike the sibling tunables above: pricing is JVM-only, so under
# CONFIGURATION.md's prime directive it has exactly one home, in this classpath
# resource. A rate change is a committed-file edit plus a redeploy (the cadence
# of a model bump), not a live lever.
llmPricing {
  # Per-MTok USD rates, human-readable dollars. Keyed on the RESOLVED model id
  # (llm_responses.model_resolved — the model the provider reports actually ran).
  # cacheWrite is the 5-minute-TTL rate.
  models {
    "claude-sonnet-4-6" { input = 3.00, output = 15.00, cacheRead = 0.30, cacheWrite = 3.75 }
  }

  # Applied to any resolved model absent from `models`; set at the priciest tier
  # we would plausibly be served. Rows priced this way carry cost_is_estimated = true.
  default { input = 10.00, output = 50.00, cacheRead = 1.00, cacheWrite = 12.50 }
}

budget {
  # Lifetime free Anthropic allowance per student, human-readable USD.
  # Spent once, cumulatively (no monthly reset); at or past it every coaching
  # surface hard-blocks until a purchase path exists (subscriptions-apple).
  freeAllowanceUsd = 5.00
  freeAllowanceUsd = ${?FREE_ALLOWANCE_USD}
}

# Subscription plan → period-budget mapping (RFC 110), read by SubscriptionPlans.
subscriptions {
  # y: the fraction of a plan's App Store price funding provider spend
  # (0 < y < 1). The margin lives in 1 − y minus Apple's commission.
  budgetRatio = 0.5
  budgetRatio = ${?BUDGET_RATIO}

  # productId → reference USD price. Budget math only — Apple owns the real,
  # localized price. Like llmPricing: no env override; a plan change is a
  # committed-file edit plus redeploy.
  plans {
    "coach.uni.UnicoachiOS.monthly10" { priceUsd = 9.99 }
  }
}

# RFC 155 D-J: the ONE origin every public-web link is derived from. Before this
# block each link restated scheme+host+port for itself, so a second public-web
# page (the Family Cost Report) meant a second copy of the same origin in
# service.conf AND a second line in every .env.<env>. The origin is stated once
# here; each page below appends only its own path.
#
# The default is the local one (required ${APP_DOMAIN} and ${PUBLIC_WEB_PORT},
# the ports .env owns). A deployed environment sets PUBLIC_WEB_URL_BASE to the
# real public-web origin (e.g. https://app.uni.coach) and BOTH links follow,
# because HOCON resolves substitutions after the merge — publicWeb.urlBase is
# read at resolve time, not at parse time.
#
# A trailing slash is tolerated: the composed value is normalized once, in
# ed.unicoach.common.config.normalizeUrlBase, applied by the typed readers
# below, so https://app.uni.coach/ yields .../report, never ...//report.
publicWeb {
  urlBase = "http://"${APP_DOMAIN}":"${PUBLIC_WEB_PORT}
  urlBase = ${?PUBLIC_WEB_URL_BASE}
}

emailVerification {
  tokenTtl = "24 hours"
  tokenTtl = ${?EMAIL_VERIFICATION_TOKEN_TTL}
  # Derived from the one origin above. EMAIL_VERIFICATION_VERIFY_URL_BASE stays
  # a supported per-link escape hatch and WINS when set: it is a shipped surface
  # and a deployed environment may already export it. Only the DEFAULT moved.
  verifyUrlBase = ${publicWeb.urlBase}"/verify-email"
  verifyUrlBase = ${?EMAIL_VERIFICATION_VERIFY_URL_BASE}
}

# RFC 155: the Family Cost Report share link. Minted here (the chat tool runs in
# rest-server) but served by public-web, so the base URL is a sibling of
# emailVerification.verifyUrlBase and is derived from the same one origin. The
# raw share token is appended as a `?token=` query parameter.
costReport {
  # COST_REPORT_SHARE_URL_BASE keeps the same escape-hatch contract as its
  # verification sibling: set, it wins; unset, the link follows publicWeb.urlBase.
  shareUrlBase = ${publicWeb.urlBase}"/report"
  shareUrlBase = ${?COST_REPORT_SHARE_URL_BASE}

  # The HMAC key a share token is derived from (RFC 155): the row stores only
  # SHA-256(token), and the token is HMAC(secret, row id), so the same row hands
  # back the same link and the raw token is persisted nowhere.
  #
  # A SECRET, so it has NO committed default here and none in .env/.env.<env>:
  # a deployed environment reads it from SSM (infra/ssm.tf), and .env.dev sets a
  # local-dev value the way DATABASE_PASSWORD does. Unlike the required toggles
  # of invariant 7 this substitution is OPTIONAL, and an environment without it
  # boots normally: sharing is the only surface that needs it, and it declines
  # with a sentence the coach can say rather than taking the server down.
  # Rotating it invalidates every link already issued; the coach is told so the
  # next time a student shares, instead of a parent's link dying silently.
  shareTokenSecret = ${?COST_REPORT_SHARE_TOKEN_SECRET}
}

auth {
  google {
    # Required substitution (no default): a forgotten cloud override fails the JVM
    # at boot rather than silently running the offline `stub` verifier. Set in
    # every env's dotenv (.env.dev=stub, .env.<env>=google). "google" | "stub".
    provider = ${GOOGLE_AUTH_PROVIDER}
    clientIds = []                       # accepted audiences; required when provider = "google"
    clientIds = ${?GOOGLE_CLIENT_IDS}    # comma-separated
    issuers = ["accounts.google.com", "https://accounts.google.com"]
    jwksUri = "https://www.googleapis.com/oauth2/v3/certs"
    jwksUri = ${?GOOGLE_JWKS_URI}
    clockSkew = "60s"
    connectTimeout = "10s"
    readTimeout = "10s"
  }

  apple {
    # Required substitution (no default): a forgotten cloud override fails the
    # JVM at boot rather than silently running the offline `stub` verifier.
    # "apple" | "stub".
    provider = ${APPLE_AUTH_PROVIDER}
    clientIds = []                      # accepted audiences (app bundle IDs)
    clientIds = ${?APPLE_CLIENT_IDS}    # comma-separated
    issuers = ["https://appleid.apple.com"]
    jwksUri = "https://appleid.apple.com/auth/keys"
    jwksUri = ${?APPLE_JWKS_URI}
    clockSkew = "60s"
    connectTimeout = "10s"
    readTimeout = "10s"
  }
}

extraction {
  enabled = true
  enabled = ${?EXTRACTION_ENABLED}

  # Job delay coalescing rapid turns; the watermark makes all-but-the-latest
  # coalesced passes cheap no-ops.
  debounce = 5m
  debounce = ${?EXTRACTION_DEBOUNCE}

  promptName = "extraction"
  promptName = ${?EXTRACTION_PROMPT_NAME}
  promptVersion = "v2"
  promptVersion = ${?EXTRACTION_PROMPT_VERSION}

  model = "claude-sonnet-4-6"
  model = ${?EXTRACTION_MODEL}
  maxTokens = 4096
  maxTokens = ${?EXTRACTION_MAX_TOKENS}

  # Safety cap on turns assembled into one pass.
  windowMaxTurns = 50
  windowMaxTurns = ${?EXTRACTION_WINDOW_MAX_TURNS}

  # Decay half-life (days) for the recency-weighted confidence formula.
  confidenceHalfLifeDays = 30.0
  confidenceHalfLifeDays = ${?EXTRACTION_CONFIDENCE_HALF_LIFE_DAYS}
}

synthesis {
  enabled = true
  enabled = ${?SYNTHESIS_ENABLED}

  promptName = "synthesis"
  promptName = ${?SYNTHESIS_PROMPT_NAME}
  promptVersion = "v2"
  promptVersion = ${?SYNTHESIS_PROMPT_VERSION}

  model = "claude-sonnet-4-6"
  model = ${?SYNTHESIS_MODEL}
  maxTokens = 4096
  maxTokens = ${?SYNTHESIS_MAX_TOKENS}

  # Safety cap on active claims assembled into one prompt.
  maxClaims = 200
  maxClaims = ${?SYNTHESIS_MAX_CLAIMS}

  # Open-set cap; a student at the cap no-ops until some resolve.
  maxOpenCommitments = 20
  maxOpenCommitments = ${?SYNTHESIS_MAX_OPEN_COMMITMENTS}

  # Ceiling on commitments created by one pass.
  maxNewCommitmentsPerRun = 5
  maxNewCommitmentsPerRun = ${?SYNTHESIS_MAX_NEW_COMMITMENTS_PER_RUN}
}

fitLens {
  # Default off: fit-lens is a heavier, retrieval-plus-two-LLM-calls sibling of
  # synthesis and ships disabled. An operator enables it (and flips the
  # 'fit-lens' periodic_jobs row to enabled = TRUE) in the same environments.
  enabled = false
  enabled = ${?FIT_LENS_ENABLED}

  model = "claude-sonnet-4-6"
  model = ${?FIT_LENS_MODEL}

  # Independent token ceilings for the two calls (formulate the query, then
  # reason over the real matches).
  queryMaxTokens = 1024
  queryMaxTokens = ${?FIT_LENS_QUERY_MAX_TOKENS}
  reasonMaxTokens = 2048
  reasonMaxTokens = ${?FIT_LENS_REASON_MAX_TOKENS}

  # Result cap handed to CollegeSearchService (coerced into its 1..25 band).
  searchLimit = 15
  searchLimit = ${?FIT_LENS_SEARCH_LIMIT}

  # Floor of active claims below which the pass no-ops (too little signal).
  minClaims = 3
  minClaims = ${?FIT_LENS_MIN_CLAIMS}

  # Safety cap on active claims assembled into the prompts.
  maxClaims = 200
  maxClaims = ${?FIT_LENS_MAX_CLAIMS}

  # Failure circuit-breaker bound: after this many consecutive failed runs on an
  # unchanged model, the pass no-ops instead of re-billing two LLM calls.
  maxConsecutiveFailures = 3
  maxConsecutiveFailures = ${?FIT_LENS_MAX_CONSECUTIVE_FAILURES}

  queryPromptName = "fit_lens_query"
  queryPromptName = ${?FIT_LENS_QUERY_PROMPT_NAME}
  # v3 (RFC 147) is v2 with the hand-written region/locale/control codebook
  # deleted: the shared filter vocabulary now advertises those words in the
  # tool schema itself.
  #
  # THIS PIN IS NOT INDEPENDENTLY ROLLBACK-ABLE. The v2 row stays in the
  # catalog (immutable-entity design), but v2's prose teaches the RETIRED
  # vocabulary — integer `region` and `control` codes, and a `locales` field
  # that no longer exists — and the shared word vocabulary refuses all three.
  # Setting FIT_LENS_QUERY_PROMPT_VERSION=v2 therefore does not restore the old
  # behaviour; it makes the fit-lens pass fail on every query the prompt asks
  # for (loudly: an unknown field and an unknown word are both named parse
  # failures, never a silently dropped filter). Rolling this back means
  # reverting RFC 147's boundary change with it.
  queryPromptVersion = "v3"
  queryPromptVersion = ${?FIT_LENS_QUERY_PROMPT_VERSION}
  reasonPromptName = "fit_lens_reason"
  reasonPromptName = ${?FIT_LENS_REASON_PROMPT_NAME}
  reasonPromptVersion = "v2"
  reasonPromptVersion = ${?FIT_LENS_REASON_PROMPT_VERSION}
}
