publicWeb {
  server {
    host = "127.0.0.1"
    host = ${?PUBLIC_WEB_HOST}
    port = 8082
    port = ${?PUBLIC_WEB_PORT}
  }
  openInApp {
    url = ${?PUBLIC_WEB_OPEN_IN_APP_URL}
  }
  # RFC 224 D-D. The cookie's IDENTITY (name, domain, Secure) is shared with
  # rest-server and lives in common/src/main/resources/session.conf; only the
  # LIFETIME is stated per client, and the web's is 30 days where rest-server's
  # is 7. This is deliberate and is asserted in PublicWebConfigTest so the two
  # numbers cannot converge or drift unnoticed: a browser session that ends 30
  # days after sign-in is what makes the absence of sliding refresh in the web
  # tier acceptable rather than a defect.
  session {
    expiration = "30d"
    expiration = ${?PUBLIC_WEB_SESSION_EXPIRATION}
  }
}
