requestLogging {
    # Shared careful defaults for all three web services (RFC 105). typesafe-config
    # merges every classpath reference.conf as the lowest-priority fallback, so
    # rest-server, admin-web, and public-web inherit this block through their
    # existing AppConfig.load path with no per-service copy.
    #
    # Each key pairs a careful literal with its optional REQUEST_LOG_* override, so
    # an env that sets no override inherits careful (never verbose), and an env
    # that sets one widens all three uniformly. Only OPTIONAL (${?VAR}) subs live
    # here: defaultReference() resolves this file standalone against the
    # environment before the app merge, so a required unresolved sub would throw
    # in every web service's boot.
    #
    # Header values NEVER logged, in any environment. Subtracted even under
    # headers="*", so widening verbosity cannot leak a secret.
    secretHeaders = "Cookie,Authorization"
    secretHeaders = ${?REQUEST_LOG_SECRET_HEADERS}
    # Request headers to attach on an enriched line: comma-separated allowlist,
    # or "*" for every header sent except secretHeaders.
    headers = "Accept,Content-Type,User-Agent,Expect,Content-Length"
    headers = ${?REQUEST_LOG_HEADERS}
    # When to attach header + body-size + latency context: "failure" (>=400, or
    # no response) or "always".
    detail = "failure"
    detail = ${?REQUEST_LOG_DETAIL}
}
