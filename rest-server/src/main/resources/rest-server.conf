server {
    # No HOCON default: SERVER_PORT is a JVM+iOS value, so it lives once in the
    # dotenv layer (.env) and HOCON pulls it from the env with a required ${VAR}.
    port = ${SERVER_PORT}
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    requestSize {
        maxSize = "8 KiB"
        maxSize = ${?SERVER_MAX_REQUEST_SIZE}
        routeOverrides {
            "/api/v1/auth/register" = "1 KiB"
            # A StoreKit 2 signed transaction carries an x5c certificate chain,
            # so the verify body legitimately exceeds the 8 KiB default; the
            # service bounds the JWS itself at 16 KiB (RFC 110), and this cap
            # covers that plus JSON envelope overhead.
            "/api/v1/subscriptions/verify" = "24 KiB"
            # An App Store Server Notification V2 nests up to three JWSes, each
            # carrying its own x5c certificate chain. AppleNotificationVerifier
            # bounds the JWS itself at 32 KiB (RFC 112); this cap sits above that
            # plus JSON envelope, so an oversized body is refused by the
            # service's own bound — where the reason is legible — rather than by
            # a bare 413. RequestSizeAppleNotificationLimitTest guards the gap.
            "/api/v1/subscriptions/apple-notifications" = "48 KiB"
        }
        routePrefixOverrides {
            "/api/v1/conversations" = "512 KiB"
        }
    }
}

# The `session { }` block moved to `common/src/main/resources/session.conf`
# (RFC 224 D-B): it is the ONE home for the cookie identity `rest-server` and
# `public-web` share. rest-server loads `session.conf` alongside this file.

sessionExpiry {
    ignorePathPrefixes = ["/health", "/api/v1/auth/logout"]
}

clientKeyGate {
    keys = ""
    keys = ${?UNICOACH_CLIENT_KEYS}
    # Apple sends no X-Unicoach-Client-Key, so without the notifications entry
    # the endpoint answers 403 in every environment where UNICOACH_CLIENT_KEYS is
    # set — a failure invisible in dev, where the gate is inert. The endpoint's
    # own authentication is the notification's JWS signature (RFC 112), not this
    # gate, so exempting it removes nothing.
    allowlistPaths = ["/healthz", "/api/v1/subscriptions/apple-notifications"]
}

requestLogging {
    # Override only: adds X-Unicoach-Client-Key to reference.conf's base secret
    # set (Cookie,Authorization). The headers/detail careful defaults are inherited
    # from web-common's reference.conf (RFC 105) and are not restated here.
    #
    # Header values NEVER logged, in any environment. Subtracted even under
    # headers="*", so widening verbosity cannot leak a secret.
    secretHeaders = "Cookie,Authorization,X-Unicoach-Client-Key"
    # REQUIRED for env parity: a service .conf scalar shadows reference.conf's
    # whole secretHeaders value (including its ${?REQUEST_LOG_SECRET_HEADERS}
    # override), so this restate keeps REQUEST_LOG_SECRET_HEADERS widening
    # rest-server too, not just admin-web/public-web.
    secretHeaders = ${?REQUEST_LOG_SECRET_HEADERS}
}
